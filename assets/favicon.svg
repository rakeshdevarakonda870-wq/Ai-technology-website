<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="favShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#2563eb" flood-opacity="0.25" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#favBg)" stroke="#bfdbfe" stroke-width="1.5" />
  <g filter="url(#favShadow)">
    <!-- Neural Node Connectors -->
    <line x1="32" y1="14" x2="18" y2="32" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />
    <line x1="32" y1="14" x2="46" y2="32" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" />
    <line x1="18" y1="32" x2="32" y2="50" stroke="#2563eb" stroke-width="3" stroke-linecap="round" />
    <line x1="46" y1="32" x2="32" y2="50" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />
    <line x1="18" y1="32" x2="46" y2="32" stroke="#60a5fa" stroke-width="2" stroke-dasharray="2 3" />
    <line x1="32" y1="14" x2="32" y2="50" stroke="url(#favGrad)" stroke-width="3" />
    
    <!-- Outer Nodes -->
    <circle cx="32" cy="14" r="5.5" fill="#06b6d4" />
    <circle cx="18" cy="32" r="5.5" fill="#2563eb" />
    <circle cx="46" cy="32" r="5.5" fill="#7c3aed" />
    <circle cx="32" cy="50" r="5.5" fill="#06b6d4" />
    
    <!-- Center Core Node -->
    <circle cx="32" cy="32" r="8" fill="url(#favGrad)" />
    <circle cx="32" cy="32" r="3.5" fill="#ffffff" />
  </g>
</svg>
