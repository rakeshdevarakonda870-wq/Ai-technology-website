<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Bright, Pearlescent -->
    <linearGradient id="brightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f0f7ff" />
      <stop offset="100%" stop-color="#e8f0fe" />
    </linearGradient>

    <!-- Vibrant 3D Node Gradients -->
    <radialGradient id="sphereCyan" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="45%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </radialGradient>

    <radialGradient id="sphereBlue" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="45%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </radialGradient>

    <radialGradient id="spherePurple" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#e9d5ff" />
      <stop offset="45%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7c3aed" />
    </radialGradient>

    <radialGradient id="sphereGreen" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="45%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </radialGradient>

    <linearGradient id="streamCyanBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="streamBluePurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <filter id="softCardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1e3a8a" flood-opacity="0.08" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- Container Base -->
  <rect width="600" height="360" rx="18" fill="url(#brightBg)" stroke="#cbd5e1" stroke-width="1.5" />
  
  <!-- Subtle Soft Grid -->
  <g opacity="0.35">
    <path d="M0,60 H600 M0,120 H600 M0,180 H600 M0,240 H600 M0,300 H600" stroke="#bfdbfe" stroke-width="0.8" stroke-dasharray="4 4" />
    <path d="M100,0 V360 M200,0 V360 M300,0 V360 M400,0 V360 M500,0 V360" stroke="#bfdbfe" stroke-width="0.8" stroke-dasharray="4 4" />
  </g>

  <!-- Header Pill Badge -->
  <rect x="30" y="22" width="225" height="28" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2" filter="url(#softCardShadow)" />
  <circle cx="45" cy="36" r="4.5" fill="#2563eb" />
  <text x="58" y="40" fill="#1e3a8a" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">Cognitive Neural Architecture</text>

  <!-- STEP 1: Sensory Input -->
  <g transform="translate(35, 105)" filter="url(#softCardShadow)">
    <rect width="105" height="155" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" />
    <circle cx="52" cy="46" r="24" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
    <path d="M42,42 L62,42 M42,47 L58,47 M42,52 L52,52" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
    <text x="52" y="98" fill="#0f172a" font-family="'Space Grotesk', sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">1. INPUT</text>
    <text x="52" y="115" fill="#0284c7" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Sensory Stream</text>
    <text x="52" y="132" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">Audio, Text, Pixels</text>
  </g>

  <!-- Connecting Stream 1 -->
  <path d="M140, 180 L 175, 180" stroke="url(#streamCyanBlue)" stroke-width="3.5" stroke-dasharray="6 4" stroke-linecap="round" />
  <polygon points="178,180 168,174 168,186" fill="#2563eb" />

  <!-- STEP 2: Deep Neural Layers (3D Matrix) -->
  <g transform="translate(178, 70)" filter="url(#softCardShadow)">
    <rect width="145" height="225" rx="16" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5" />
    <rect x="0" y="0" width="145" height="34" rx="16" fill="#f5f3ff" />
    <text x="72" y="22" fill="#6d28d9" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="0.5">DEEP NEURAL LAYERS</text>
    
    <!-- 3D Luminous Sphere Nodes -->
    <!-- Input Column -->
    <circle cx="38" cy="70" r="9" fill="url(#sphereCyan)" />
    <circle cx="38" cy="125" r="9" fill="url(#sphereCyan)" />
    <circle cx="38" cy="180" r="9" fill="url(#sphereCyan)" />

    <!-- Latent Representation Column -->
    <circle cx="108" cy="55" r="9" fill="url(#spherePurple)" />
    <circle cx="108" cy="100" r="9" fill="url(#spherePurple)" />
    <circle cx="108" cy="150" r="9" fill="url(#spherePurple)" />
    <circle cx="108" cy="195" r="9" fill="url(#spherePurple)" />

    <!-- Synaptic Lines -->
    <line x1="38" y1="70" x2="108" y2="55" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.8" />
    <line x1="38" y1="70" x2="108" y2="100" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6" />
    <line x1="38" y1="125" x2="108" y2="100" stroke="#7c3aed" stroke-width="2.2" stroke-opacity="0.85" />
    <line x1="38" y1="125" x2="108" y2="150" stroke="#38bdf8" stroke-width="1.4" stroke-opacity="0.7" />
    <line x1="38" y1="180" x2="108" y2="150" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.7" />
    <line x1="38" y1="180" x2="108" y2="195" stroke="#2563eb" stroke-width="1.8" stroke-opacity="0.85" />
  </g>

  <!-- Connecting Stream 2 -->
  <path d="M323, 180 L 358, 180" stroke="url(#streamBluePurple)" stroke-width="3.5" stroke-dasharray="6 4" stroke-linecap="round" />
  <polygon points="361,180 351,174 351,186" fill="#7c3aed" />

  <!-- STEP 3: Attention & Weights -->
  <g transform="translate(360, 95)" filter="url(#softCardShadow)">
    <rect width="110" height="175" rx="14" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5" />
    <circle cx="55" cy="46" r="24" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5" />
    <path d="M47,46 L53,52 L65,40" stroke="#7c3aed" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
    <text x="55" y="98" fill="#0f172a" font-family="'Space Grotesk', sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">3. ATTENTION</text>
    <text x="55" y="116" fill="#7c3aed" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Self-Attention Matrix</text>
    <text x="55" y="136" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">Weight Matrix</text>
    <text x="55" y="150" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">Loss Minimization</text>
  </g>

  <!-- Connecting Stream 3 -->
  <path d="M470, 180 L 498, 180" stroke="#10b981" stroke-width="3.5" stroke-dasharray="6 4" stroke-linecap="round" />
  <polygon points="501,180 491,174 491,186" fill="#10b981" />

  <!-- STEP 4: Inference & Synthesis -->
  <g transform="translate(500, 105)" filter="url(#softCardShadow)">
    <rect width="82" height="155" rx="14" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5" />
    <circle cx="41" cy="46" r="22" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" />
    <polygon points="41,36 50,52 32,52" fill="url(#sphereGreen)" />
    <text x="41" y="98" fill="#0f172a" font-family="'Space Grotesk', sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">4. ACTION</text>
    <text x="41" y="116" fill="#059669" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Inference</text>
    <text x="41" y="134" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" text-anchor="middle">Generated Work</text>
    <text x="41" y="146" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" text-anchor="middle">&amp; Decisions</text>
  </g>
</svg>
