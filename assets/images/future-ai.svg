<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Luminous Soft Lavender & Azure -->
    <linearGradient id="futureBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#faf5ff" />
      <stop offset="100%" stop-color="#eff6ff" />
    </linearGradient>

    <!-- 3D Core Radial Glow -->
    <radialGradient id="sphereCoreLight" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#a5f3fc" />
      <stop offset="60%" stop-color="#60a5fa" />
      <stop offset="85%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4338ca" />
    </radialGradient>

    <linearGradient id="orbitRingsGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="orbitRingsGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#6366f1" flood-opacity="0.25" />
    </filter>

    <filter id="pillShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e293b" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Container Base -->
  <rect width="600" height="380" rx="18" fill="url(#futureBg)" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Subtle Constellation Pattern -->
  <g opacity="0.4">
    <circle cx="80" cy="70" r="2" fill="#2563eb" />
    <circle cx="140" cy="120" r="1.5" fill="#7c3aed" />
    <circle cx="510" cy="90" r="2" fill="#06b6d4" />
    <circle cx="490" cy="290" r="1.8" fill="#ec4899" />
    <circle cx="90" cy="300" r="1.5" fill="#2563eb" />
  </g>

  <!-- Orbital Rings & Quantum Core -->
  <g transform="translate(300, 190)">
    <!-- Ring 1 -->
    <ellipse cx="0" cy="0" rx="220" ry="80" fill="none" stroke="url(#orbitRingsGrad1)" stroke-width="2" stroke-opacity="0.6" transform="rotate(-25)" stroke-dasharray="8 6" />
    <!-- Ring 2 -->
    <ellipse cx="0" cy="0" rx="200" ry="90" fill="none" stroke="url(#orbitRingsGrad2)" stroke-width="2.2" stroke-opacity="0.75" transform="rotate(35)" />
    <!-- Ring 3 -->
    <ellipse cx="0" cy="0" rx="180" ry="50" fill="none" stroke="#06b6d4" stroke-width="1.8" stroke-opacity="0.7" transform="rotate(-65)" />

    <!-- 3D Luminous Quantum Core -->
    <circle cx="0" cy="0" r="85" fill="url(#sphereCoreLight)" filter="url(#softGlow)" />
    <circle cx="0" cy="0" r="62" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.8" stroke-dasharray="14 6" />

    <!-- Inner Core Synapse Nodes -->
    <g>
      <circle cx="-25" cy="-20" r="7" fill="#ffffff" />
      <circle cx="30" cy="-15" r="6" fill="#a5f3fc" />
      <circle cx="-15" cy="30" r="6.5" fill="#fbcfe8" />
      <circle cx="28" cy="25" r="6" fill="#ffffff" />

      <!-- Synaptic connections -->
      <line x1="-25" y1="-20" x2="30" y2="-15" stroke="#ffffff" stroke-width="2.5" />
      <line x1="-25" y1="-20" x2="-15" y2="30" stroke="#a5f3fc" stroke-width="2" />
      <line x1="30" y1="-15" x2="28" y2="25" stroke="#fbcfe8" stroke-width="2" />
      <line x1="-15" y1="30" x2="28" y2="25" stroke="#ffffff" stroke-width="2.5" />
    </g>

    <!-- Floating Horizon Milestones (Bright Glass Badges) -->
    <g transform="translate(-165, -70)" filter="url(#pillShadow)">
      <rect x="-55" y="-14" width="110" height="28" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" />
      <circle cx="-38" cy="0" r="4.5" fill="#0284c7" />
      <text x="-25" y="4" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">AGI Horizons</text>
    </g>

    <g transform="translate(170, -60)" filter="url(#pillShadow)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5" />
      <circle cx="-48" cy="0" r="4.5" fill="#7c3aed" />
      <text x="-35" y="4" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">Quantum Synergy</text>
    </g>

    <g transform="translate(145, 95)" filter="url(#pillShadow)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5" />
      <circle cx="-48" cy="0" r="4.5" fill="#10b981" />
      <text x="-35" y="4" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">Ethical Alignment</text>
    </g>

    <g transform="translate(-155, 80)" filter="url(#pillShadow)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#ffffff" stroke="#fde68a" stroke-width="1.5" />
      <circle cx="-48" cy="0" r="4.5" fill="#f59e0b" />
      <text x="-35" y="4" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">Human Centaur</text>
    </g>
  </g>

  <!-- Title Pill -->
  <rect x="25" y="22" width="240" height="28" rx="14" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.2" filter="url(#pillShadow)" />
  <circle cx="40" cy="36" r="4.5" fill="#8b5cf6" />
  <text x="54" y="40" fill="#4338ca" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">The Frontier of Cognitive Evolution</text>
</svg>
