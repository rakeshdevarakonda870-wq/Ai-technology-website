<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <linearGradient id="learnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Column Top Ribbon Gradients -->
    <linearGradient id="gradSup" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="gradUnsup" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#c026d3" />
    </linearGradient>

    <linearGradient id="gradReinf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#334155" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="320" rx="18" fill="url(#learnBg)" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- 1. Supervised Learning Column -->
  <g transform="translate(25, 25)" filter="url(#cardShadow)">
    <rect width="165" height="270" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" />
    <path d="M0,14 Q0,0 14,0 L151,0 Q165,0 165,14 L165,6 Q165,0 151,0 Z" fill="url(#gradSup)" />
    <rect x="0" y="0" width="165" height="6" rx="3" fill="url(#gradSup)" />
    
    <circle cx="82" cy="45" r="22" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
    <path d="M74,45 L86,37 L94,45 L82,53 Z M78,43 A2,2 0 1,1 78,41" stroke="#2563eb" stroke-width="1.8" fill="none" />
    
    <text x="82" y="90" fill="#0f172a" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" text-anchor="middle">SUPERVISED</text>
    <text x="82" y="106" fill="#0284c7" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Ground-Truth Labels</text>
    
    <!-- Mini schema -->
    <rect x="18" y="122" width="129" height="30" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
    <text x="82" y="141" fill="#475569" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Input (X) → Label (Y)</text>

    <!-- Visual classification dots -->
    <circle cx="45" cy="180" r="5" fill="#0284c7" />
    <circle cx="60" cy="190" r="5" fill="#0284c7" />
    <circle cx="50" cy="205" r="5" fill="#0284c7" />

    <line x1="82" y1="165" x2="82" y2="225" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3" />

    <circle cx="115" cy="175" r="5" fill="#ec4899" />
    <circle cx="100" cy="200" r="5" fill="#ec4899" />
    <circle cx="120" cy="210" r="5" fill="#ec4899" />

    <text x="82" y="252" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" text-anchor="middle">Classification &amp; Regression</text>
  </g>

  <!-- 2. Unsupervised Learning Column -->
  <g transform="translate(217, 25)" filter="url(#cardShadow)">
    <rect width="165" height="270" rx="14" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5" />
    <rect x="0" y="0" width="165" height="6" rx="3" fill="url(#gradUnsup)" />
    
    <circle cx="82" cy="45" r="22" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5" />
    <circle cx="76" cy="41" r="3.5" fill="#7c3aed" />
    <circle cx="88" cy="40" r="4.5" fill="#a855f7" />
    <circle cx="82" cy="51" r="4" fill="#c026d3" />

    <text x="82" y="90" fill="#0f172a" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" text-anchor="middle">UNSUPERVISED</text>
    <text x="82" y="106" fill="#7c3aed" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Pattern Discovery</text>
    
    <rect x="18" y="122" width="129" height="30" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
    <text x="82" y="141" fill="#475569" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Unlabeled Data (X) Only</text>

    <!-- Cluster circles -->
    <ellipse cx="55" cy="195" rx="26" ry="20" fill="#f5f3ff" stroke="#a78bfa" stroke-dasharray="3 3" />
    <circle cx="50" cy="193" r="3.5" fill="#7c3aed" />
    <circle cx="62" cy="189" r="3.5" fill="#7c3aed" />
    <circle cx="56" cy="201" r="3.5" fill="#7c3aed" />

    <ellipse cx="112" cy="190" rx="23" ry="18" fill="#fdf4ff" stroke="#e879f9" stroke-dasharray="3 3" />
    <circle cx="108" cy="187" r="3.5" fill="#c026d3" />
    <circle cx="118" cy="192" r="3.5" fill="#c026d3" />

    <text x="82" y="252" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" text-anchor="middle">Clustering &amp; Embeddings</text>
  </g>

  <!-- 3. Reinforcement Learning Column -->
  <g transform="translate(410, 25)" filter="url(#cardShadow)">
    <rect width="165" height="270" rx="14" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5" />
    <rect x="0" y="0" width="165" height="6" rx="3" fill="url(#gradReinf)" />
    
    <circle cx="82" cy="45" r="22" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" />
    <path d="M72,45 A10,10 0 1,1 92,45" fill="none" stroke="#059669" stroke-width="2.5" />
    <polygon points="92,45 87,39 96,39" fill="#059669" />

    <text x="82" y="90" fill="#0f172a" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" text-anchor="middle">REINFORCEMENT</text>
    <text x="82" y="106" fill="#059669" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Reward Policy Loop</text>
    
    <rect x="18" y="122" width="129" height="30" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
    <text x="82" y="141" fill="#475569" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Agent ↔ Environment</text>

    <!-- State action reward visual -->
    <circle cx="50" cy="190" r="15" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5" />
    <text x="50" y="194" fill="#059669" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="700" text-anchor="middle">AGENT</text>

    <path d="M66,185 C78,170 92,170 102,185" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="3 2" />
    <text x="84" y="165" fill="#d97706" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Action</text>

    <circle cx="118" cy="190" r="15" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
    <text x="118" y="194" fill="#2563eb" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="700" text-anchor="middle">ENV</text>

    <path d="M102,200 C92,215 78,215 66,200" fill="none" stroke="#10b981" stroke-width="1.8" />
    <text x="84" y="228" fill="#059669" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Reward +1</text>

    <text x="82" y="252" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" text-anchor="middle">Policy &amp; Value Iteration</text>
  </g>
</svg>
